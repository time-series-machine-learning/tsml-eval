# The CPU half of the resample-0 gap fill: six datasets that the leaderboard drops for
# want of one or two results each, and that nothing else is queued to produce.
#
#   FaceDetection     FreshPRINCE
#   FordChallenge     FreshPRINCE
#   Skoda             FreshPRINCE
#   STEW              HC2, TDE
#   BIDMC32HR_disc    1NN-DTW      (LiteTIME is in the GPU gap fill)
#   BIDMC32SpO2_disc  1NN-DTW      (LiteTIME is in the GPU gap fill)
#
# Eight jobs. Completing the first four datasets raises the common set from 51 to 55;
# the two BIDMC sets follow once the GPU half lands LiteTIME on them.
#
# On Iridis 6's batch queue, which is where the 620 GB MUSE recovery jobs are running.
# The memory ladder starts at 128 GB rather than 32 because that is where these already
# failed, not a guess: FreshPRINCE recorded "OOM at 128GB" after eight attempts on
# FaceDetection, FordChallenge and Skoda alike. The 620 GB tier is what recovered
# MindReading, MotionSenseHAR and Tiselac for MUSE after the same class of failure.
#
# One caveat. 1NN-DTW on BIDMC32HR_disc is the only entry here that failed on time
# rather than memory, and it did so against Hali's 7 day limit. Iridis 6 caps at 60
# hours, so this is the one job more likely to fail here than there; if it times out,
# move that pair back to Hali rather than retrying.
#
# Datasets deliberately absent, because compute cannot fix them:
#   PenDigits   MRHydra raises "n_timepoints must be >= 9 but found 8"; the series are
#               length 8, so the dataset can never complete while MRHydra is a column.
#   Tiselac     RDST and MRHydra hit LAPACK integer overflow in RidgeClassifierCV's
#   Australia-  SVD, aeon issue 3738, after 12 to 14 attempts. ROCKET hits the same on
#   Rainfall    AustraliaRainfall. Fixing 3738 unblocks five pairs across the two.
#   EmoPain     aeon's check_collection_variance rejects it before fit for every aeon
#               classifier.

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
# The GPU checkout, reused because it exists, is on ajb/gpu and therefore already has
# this file. repo_dir and env_name are independent: the jobs run in the CPU environment
# regardless of what the checkout is called.
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/MultivariateClassification6-CoreGapsCPU.txt"
results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-core-gaps-resample0-non-deep"
resamples = 1
max_attempts = 2
all_categories_first_pass = true
small_datasets_first = true
excluded_datasets = []
validate_results = false
expected_branch = "ajb/gpu"

[slurm]
partition = "batch"
account = ""
qos = ""
max_active_tasks = 8
cpus_per_task = 1
memory_mb_levels = [128000, 620000]
# Iridis 6 caps every job at 60 hours, against Hali's 7 days.
time_limit = "2-12:00:00"

[environment]
module = "conda/python3"
conda_sh = ""
env_name = "tsml-eval"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval"

[[categories]]
name = "FeatureBased"
classifiers = ["FreshPRINCE"]

[[categories]]
name = "Hybrid"
classifiers = ["HC2"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]

[[categories]]
name = "DistanceBased"
classifiers = ["1NN-DTW"]
