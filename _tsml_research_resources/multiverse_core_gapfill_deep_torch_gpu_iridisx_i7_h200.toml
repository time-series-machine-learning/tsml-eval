# Fill the remaining resample-0 gaps for the PyTorch deep learners, on IridisX's
# i7_h200 Early Access queue.
#
# Ten jobs across three classifiers, so one dataset list holds the union of the
# gaps and the controller works out which pairs are actually missing: it counts a
# dataset done when its testResample0.csv exists, and every other combination in
# this list already has one.
#
#   ConvTran   Alzheimers, EigenWorms, PhotoStimulation
#   TS2Vec     AustraliaRainfall_disc, Locust2022, Tiselac, USCActivity
#
# ConvTran's three failed with CUDA out of memory after two attempts, but on the
# A100 partition. The fix here is the card, not the host allocation: an H200 NVL
# carries 141 GB against the A100's 40 or 80, and memory_mb_levels only ever
# governed host RAM.
#
# TS2Vec's four exhausted a 60 hour job before the probe was capped. The cap is
# now the authors' own MAX_SAMPLES of 10000, applied by default, so these are
# worth one more attempt rather than a longer walltime.
#
# LiteTIME's three gaps are in the _keras_ variant of this file, because gpu_check
# is per config and a torch check would pass while TensorFlow saw no GPU.

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/MultivariateClassification9-DeepGaps.txt"
results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-core-gapfill-deep-torch-i7-h200"
resamples = 1
max_attempts = 2
all_categories_first_pass = false
small_datasets_first = true
excluded_datasets = []
validate_results = false
expected_branch = "ajb/gpu"

[slurm]
account = ""
partition = "i7_h200"
qos = ""
max_active_tasks = 8
cpus_per_task = 2
gpus = 1
nodes = 1
gres = "gpu:h200:1"
memory_mb_levels = [64000, 128000]
time_limit = "2-12:00:00"

[environment]
module = "conda/python3"
conda_sh = ""
env_name = "tsml-eval-gpu"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval-gpu"
gpu_check = "torch"

[classifier_kwargs.ConvTran]
device = "cuda"
verbose = true

[classifier_kwargs.TS2Vec]
device = "cuda"
verbose = true

[[categories]]
name = "DeepLearning"
classifiers = ["ConvTran", "TS2Vec"]
