# Default-resample H-InceptionTime GPU completion pass for MultiverseCore on IridisX.
# This mirrors multiverse_core_resample0_hinception_gpu.toml, which is the same pass
# on Hali. Keep the two in step: only the cluster-specific sections should differ.
#
# Differences from the Hali configuration, all forced by the cluster:
#   - paths are under /home, IridisX has no /gpfs
#   - no account or QoS, the default association needs neither
#   - swarm_a100 advertises gpu:a100swarm, so the full gres string must be given
#   - 5 day partition limit rather than Hali's 7

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"
# Read the 66 problem core list straight from the checkout, so no copy-and-rename
# step is needed and the list is versioned with the code
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/MultivariateClassification66-MultiverseMini.txt"
results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-core-resample0-hinception-gpu"
resamples = 1
max_attempts = 1
all_categories_first_pass = false
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
# This account ("normal") needs no explicit account or QoS directive on the a100
# partition, which only denies the student accounts. If access to the ecs account is
# granted, switch to partition = "swarm_a100", gres = "gpu:a100swarm:1",
# account = "ecs" and time_limit up to 5-00:00:00 for 8 concurrent GPUs instead of 2
account = ""
partition = "a100"
qos = ""

# The open a100 partition is 12 nodes x 2 A100 80GB. Its QoS caps concurrent GPUs at
# 2, so tasks beyond that queue rather than run. swarm_a100 would allow 8, but it has
# AllowAccounts=ecs,orc and this account is in "normal" only
max_active_tasks = 66
cpus_per_task = 2
gpus = 1

# The a100 partition advertises gpu:a100. On swarm_a100 this must be gpu:a100swarm:1
# instead, so the type has to change alongside the partition
gres = "gpu:a100:1"

memory_mb_levels = [64000]

# The a100 partition allows up to 2-12:00:00, well under Hali's 7 day limit. Asking
# for more than a partition allows is rejected at submission
time_limit = "2-00:00:00"

[environment]
module = "conda/python3"
# Empty means the job derives conda.sh from the loaded module at runtime, which
# avoids pinning a path that has not been verified on this cluster
conda_sh = ""
env_name = "tsml-eval-gpu"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval-gpu"

[[categories]]
name = "DeepLearning"
classifiers = ["H-InceptionTime"]
