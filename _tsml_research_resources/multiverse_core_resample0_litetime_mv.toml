# Default-resample LITETime-MV CPU completion pass for the Multiverse paper on
# Hali. This is intentionally separate from the non-deep paper-classifier pass.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseCore.txt"

# Keep the MV variant separate from the existing ordinary LiteTIME results.
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-core-resample0-litetime-mv"
resamples = 1
max_attempts = 1
all_categories_first_pass = false

# Complete the tractable problems first. AustraliaRainfall remains included and
# will be submitted after smaller downloaded datasets.
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
memory_mb_levels = [64000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[[categories]]
name = "DeepLearning"
classifiers = ["LITETime-MV"]
