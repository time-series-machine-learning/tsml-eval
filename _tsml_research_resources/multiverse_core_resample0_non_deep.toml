# Default-resample completion pass for the non-deep classifiers evaluated in the
# Multiverse paper. Existing results are detected and are never overwritten.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseCore.txt"

# Store every classifier under its algorithm type.
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-core-resample0-non-deep"
resamples = 1

# Non-OOM failures get one attempt. OOMs are retried automatically at the next
# configured memory level by later controller cycles.
max_attempts = 1
all_categories_first_pass = true
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
memory_mb_levels = [32000, 64000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[[categories]]
name = "IntervalBased"
classifiers = ["CIF-500", "DrCIF-500", "QUANT"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]

[[categories]]
name = "ShapeletBased"
classifiers = ["RDST", "STC"]

[[categories]]
name = "ConvolutionBased"
classifiers = ["Arsenal", "MRHydra", "ROCKET"]

[[categories]]
name = "DistanceBased"
classifiers = ["1NN-DTW"]

[[categories]]
name = "FeatureBased"
classifiers = ["Catch22", "FreshPRINCE"]

[[categories]]
name = "Hybrid"
classifiers = ["HC2", "RIST"]

[[categories]]
name = "Other"
classifiers = ["Dummy"]
