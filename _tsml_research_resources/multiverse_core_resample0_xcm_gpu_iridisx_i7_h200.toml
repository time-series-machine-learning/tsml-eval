# XCM resample-0 pass on IridisX's i7_h200 Early Access queue.
#
# A copy of the ConvTran i7_h200 config with three changes, all forced by XCM
# being a Keras port rather than a PyTorch one:
#   - gpu_check is "tensorflow", so the preflight check imports the framework
#     XCM actually uses; a torch check would pass while TensorFlow saw no GPU.
#   - no device kwarg, since XCM has no such parameter. Keras places work on
#     the visible GPU by itself.
#   - its own state_dir, so this controller takes a distinct supervisor lock
#     and does not collide with a ConvTran, TimesURL or TS2Vec run.

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/MultivariateClassification66-MultiverseMini.txt"
results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-core-resample0-xcm-i7-h200"
resamples = 1
max_attempts = 2
all_categories_first_pass = false
small_datasets_first = true
excluded_datasets = []
validate_results = false
expected_branch = "ajb/gpu"

[slurm]
account = ""
partition = "i7_h200"
qos = ""
max_active_tasks = 8
cpus_per_task = 2
gpus = 1
nodes = 1
gres = "gpu:h200:1"
memory_mb_levels = [64000, 128000]
time_limit = "2-12:00:00"

[environment]
module = "conda/python3"
conda_sh = ""
env_name = "tsml-eval-gpu"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval-gpu"
gpu_check = "tensorflow"

[classifier_kwargs.XCM]
verbose = true

[[categories]]
name = "DeepLearning"
classifiers = ["XCM"]
