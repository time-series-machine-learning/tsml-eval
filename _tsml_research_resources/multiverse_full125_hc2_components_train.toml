# B: HC2 component results, with train files, for the four datasets in the 125 where
# HC2 itself is still missing: BIDMC32RR_disc, PAMAP2, PPGDalia_disc and WISDM2.
#
# HC2 is then rebuilt from these files with FromFileHIVECOTE, as it was for
# AustraliaRainfall_disc, STEW, Tiselac and USCActivity. The CAWPE weights come from
# the component train estimates, so every component needs a train file.
#
# Where a component already has a test file, only the missing train file is built
# (tsml-eval keeps an existing test file). At 2026-09-18 Arsenal, DrCIF-500 and STC
# had test files for all four datasets and TDE had none for PAMAP2, PPGDalia_disc and
# WISDM2, so those three TDE runs also produce the test result.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/Code/tsml-eval/_tsml_research_resources/dataset_lists/MultiverseFull125-HC2Rebuild.txt"
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-full125-hc2-components-train"
expected_branch = "ajb/hc2"
resamples = 1
build_train_files = true
all_categories_first_pass = true
ignore_existing_failure_logs = true
max_attempts = 2
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
memory_mb_levels = [32000, 64000, 128000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[classifier_kwargs."DrCIF-500"]
verbose = 1

[classifier_kwargs.TDE]
verbose = 1

[classifier_kwargs.Arsenal]
verbose = 1

[[categories]]
name = "ConvolutionBased"
classifiers = ["Arsenal"]

[[categories]]
name = "IntervalBased"
classifiers = ["DrCIF-500"]

[[categories]]
name = "ShapeletBased"
classifiers = ["STC"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]
