# Default-resample CPU pass for the non-deep Multiverse paper classifiers over
# every locally downloaded problem except DREAM* and S2Agri-*. The launcher
# creates the local-only dataset list before starting this controller.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseAvailableCPU.txt"
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-full-resample0-cpu-32gb"
expected_branch = "ajb/hc2"
resamples = 1

# Obtain broad coverage before retrying individual failures.
all_categories_first_pass = true
ignore_existing_failure_logs = true
max_attempts = 1
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000

# Begin at 32 GB. Confirmed OOMs are retried at 64 GB and then 128 GB.
memory_mb_levels = [32000, 64000, 128000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[classifier_kwargs."DrCIF-500"]
verbose = 1

[classifier_kwargs.TDE]
verbose = 1

[classifier_kwargs.Arsenal]
verbose = 1

[classifier_kwargs.FreshPRINCE]
verbose = 1

[classifier_kwargs.HC2]
verbose = 1

[[categories]]
name = "IntervalBased"
classifiers = ["CIF-500", "DrCIF-500", "QUANT"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]

[[categories]]
name = "ShapeletBased"
classifiers = ["RDST", "STC"]

[[categories]]
name = "ConvolutionBased"
classifiers = ["Arsenal", "MRHydra", "ROCKET"]

[[categories]]
name = "DistanceBased"
classifiers = ["1NN-DTW"]

[[categories]]
name = "FeatureBased"
classifiers = ["Catch22", "FreshPRINCE"]

[[categories]]
name = "Hybrid"
classifiers = ["HC2", "RIST"]

[[categories]]
name = "Other"
classifiers = ["Dummy"]
