# Completion pass for default-resample, non-deep Multiverse paper classifiers.
# The launcher prepares every locally runnable clean archive problem first.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseFullCPU.txt"
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-full-resample0-cpu-completion"
expected_branch = "ajb/hc2"
resamples = 1
all_categories_first_pass = true
ignore_existing_failure_logs = true
# Permit one retry for jobs recorded by the first completion pass. OOM retries
# continue to follow the separate 32/64/128 GB memory escalation logic.
max_attempts = 2
small_datasets_first = true
excluded_datasets = ["LenDB"]
validate_results = false

# Known core terminal outcomes are deliberately not resubmitted.
excluded_tasks = [
    # Software/algorithm limitations (6).
    "ShapeletBased|RDST|AustraliaRainfall_disc|0",
    "ShapeletBased|RDST|Tiselac|0",
    "ConvolutionBased|MRHydra|Tiselac|0",
    "ConvolutionBased|ROCKET|AustraliaRainfall_disc|0",
    "ConvolutionBased|MRHydra|PenDigits|0",
    "ShapeletBased|RDST|USCActivity|0",
    # OOM at 128 GB (5).
    "ConvolutionBased|MRHydra|AustraliaRainfall_disc|0",
    "FeatureBased|FreshPRINCE|FaceDetection|0",
    "FeatureBased|FreshPRINCE|FordChallenge|0",
    "FeatureBased|FreshPRINCE|Skoda|0",
    "FeatureBased|FreshPRINCE|Tiselac|0",
    # Seven-day limit (9), including the four user-classified cancellations.
    "DictionaryBased|TDE|AustraliaRainfall_disc|0",
    "DictionaryBased|TDE|Tiselac|0",
    "DictionaryBased|TDE|USCActivity|0",
    "DistanceBased|1NN-DTW|BIDMC32HR_disc|0",
    "Hybrid|HC2|AustraliaRainfall_disc|0",
    "DictionaryBased|TDE|STEW|0",
    "Hybrid|HC2|STEW|0",
    "Hybrid|HC2|Tiselac|0",
    "Hybrid|HC2|USCActivity|0",
]

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
memory_mb_levels = [32000, 64000, 128000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[classifier_kwargs."DrCIF-500"]
verbose = 1

[classifier_kwargs.TDE]
verbose = 1

[classifier_kwargs.Arsenal]
verbose = 1

[classifier_kwargs.FreshPRINCE]
verbose = 1

[classifier_kwargs.HC2]
verbose = 1

[[categories]]
name = "IntervalBased"
classifiers = ["CIF-500", "DrCIF-500", "QUANT"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]

[[categories]]
name = "ShapeletBased"
classifiers = ["RDST", "STC"]

[[categories]]
name = "ConvolutionBased"
classifiers = ["Arsenal", "MRHydra", "ROCKET"]

[[categories]]
name = "DistanceBased"
classifiers = ["1NN-DTW"]

[[categories]]
name = "FeatureBased"
classifiers = ["Catch22", "FreshPRINCE"]

[[categories]]
name = "Hybrid"
classifiers = ["HC2", "RIST"]

[[categories]]
name = "Other"
classifiers = ["Dummy"]
