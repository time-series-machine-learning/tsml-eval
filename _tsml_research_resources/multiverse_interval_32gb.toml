# IntervalBased-only 32 GB completion pass for the Multiverse experiments on Hali.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseCore.txt"
results_root = "/gpfs/home/{username}/Results/Multiverse"

# Keep this pass independent from the earlier breadth-first 8 GB attempt history.
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-interval-32gb"
resamples = 30
max_attempts = 1
all_categories_first_pass = false
small_datasets_first = true

# Include every MultiverseCore problem in this completion pass.
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
memory_mb_levels = [32000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

[[categories]]
name = "IntervalBased"
classifiers = [
    "CIF",
    "DrCIF",
    "QUANT",
    "RSTSF",
    "RandomIntervals",
    "RISE",
    "SupervisedIntervals",
    "STSF",
    "TSF",
]
