# LITETime-MV GPU pass over a hand-picked list of missing problems, on IridisX.
#
# Use this instead of multiverse_core_resample0_litemv_gpu_iridisx.toml when only
# some problems are outstanding, typically because the rest were completed on Hali
# and those results are not present in this cluster's results tree.
#
# The controller always skips work it can already see on disk: any dataset and
# resample with a nonempty testResample<n>.csv under results_root is never
# resubmitted. That check is per cluster, so results held only on Hali look missing
# here. Either copy them across, or list the outstanding problems below.
#
# WRITE THE LIST FIRST. One dataset name per line, matching the archive directory
# names exactly, blank lines and # comments allowed:
#
#   mkdir -p ~/DataSetLists
#   nano ~/DataSetLists/LITETimeMV-Missing.txt
#
# To see what this cluster is missing from the 66 problem core list:
#
#   cd ~/Code/tsml-eval-gpu
#   results=~/Results/Multiverse/DeepLearning/LITETime-MV/Predictions
#   while read -r d; do
#       [ -s "$results/$d/testResample0.csv" ] || echo "$d"
#   done < _tsml_research_resources/dataset_lists/MultivariateClassification66-MultiverseMini.txt

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"

# The outstanding problems, not the full core list. This list is versioned with the
# code so it arrives with a git pull, and is a snapshot taken on 15/08/2026: the 24
# problems of the 66 core list with no LITETime-MV result. Shorten it as results land,
# or point this at a hand-maintained file such as
# "/home/{username}/DataSetLists/LITETimeMV-Missing.txt" instead
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/Multivariate24-LITETimeMV-Missing.txt"

results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-litemv-missing-gpu"
resamples = 1
max_attempts = 1
all_categories_first_pass = false
small_datasets_first = true
excluded_datasets = []

# Checks the contents of an existing results file rather than only that it is
# nonempty. Slower, but worth it when deciding what is genuinely missing, as a job
# killed mid-write leaves a file that the cheap check would count as complete
validate_results = true

[slurm]
account = ""
partition = "a100"
qos = ""
max_active_tasks = 66
cpus_per_task = 2
gpus = 1
nodes = 1
gres = "gpu:a100:1"
memory_mb_levels = [64000]
time_limit = "2-00:00:00"

[environment]
module = "conda/python3"
conda_sh = ""
env_name = "tsml-eval-gpu"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval-gpu"

[[categories]]
name = "DeepLearning"
classifiers = ["LITETime-MV"]
