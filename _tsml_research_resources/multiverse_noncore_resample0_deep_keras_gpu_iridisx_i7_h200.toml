# Resample-0 pass over the non-core Multiverse datasets that already have data, on
# IridisX's i7_h200 Early Access queue.
#
# Beyond the core 66 the archive has 73 more datasets, of which 32 are downloaded.
# Three of those are the UEA sets handled by uea_completion_*, and six have no
# results from any estimator at all and need a full-archive pass rather than a GPU
# one. That leaves the 23 here, and they are unusually uniform: fifteen of them are
# missing exactly the same nine estimators, six GPU and three CPU.
#
#   ConvTran, DisjointCNN, PatchMTSC, TimesNet, TimesURL, TS2Vec   missing on all 23
#   H-InceptionTime                                    missing on 3 (Short/LongInterval-
#                                                      Task family and WISDM2)
#   LITETime-MV                                        already has all 23
#
# 141 GPU experiments in total across the two configurations.
#
# These add nothing to the leaderboard on their own. Every one of the 23 is also
# missing STSF, Summary and TSF, which never had a non-core pass, and a few need more
# besides. The GPU half is the larger and slower part, so it is worth starting first,
# but the CPU half has to follow or the datasets stay outside the scored set.
#
# Sizes run from 46 MB to 11 GB on disk, LongIntervalTask being the largest and
# ShortIntervalTask next; small_datasets_first puts the cheap ones through first.
#
# The Keras half, split from the torch variant because gpu_check is per configuration
# and a torch check would pass while TensorFlow saw no GPU.

[controller]
username = "ajb2u23"
email = "ajb@uea.ac.uk"
repo_dir = "/home/{username}/Code/tsml-eval-gpu"
data_dir = "/home/{username}/Data/Multiverse"
dataset_file = "/home/{username}/Code/tsml-eval-gpu/_tsml_research_resources/dataset_lists/MultivariateClassification23-NonCoreGPUReady.txt"
results_root = "/home/{username}/Results/Multiverse"
state_dir = "/home/{username}/Results/Multiverse/.controller-noncore-resample0-deep-keras-i7-h200"
resamples = 1
max_attempts = 2
all_categories_first_pass = false
small_datasets_first = true
excluded_datasets = []
validate_results = false
expected_branch = "ajb/gpu"

[slurm]
account = ""
partition = "i7_h200"
qos = ""
max_active_tasks = 8
cpus_per_task = 2
gpus = 1
nodes = 1
gres = "gpu:h200:1"
memory_mb_levels = [64000, 128000]
time_limit = "2-12:00:00"

[environment]
module = "conda/python3"
conda_sh = ""
env_name = "tsml-eval-gpu"
numba_cache_dir = "/home/{username}/Code/.cache/numba/tsml-eval-gpu"
gpu_check = "tensorflow"

# No device kwarg: Keras places work on the visible GPU itself.
[classifier_kwargs.DisjointCNN]
verbose = true

[classifier_kwargs.H-InceptionTime]
verbose = true

[[categories]]
name = "DeepLearning"
classifiers = ["DisjointCNN", "H-InceptionTime"]
