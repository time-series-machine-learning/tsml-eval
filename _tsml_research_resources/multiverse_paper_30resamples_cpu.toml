# Thirty-resample CPU pass for every classifier used in the Multiverse paper.
# Existing results are retained. Categories run strictly in the order below.

[controller]
username = "ajb"
email = "ajb@uea.ac.uk"
repo_dir = "/gpfs/home/{username}/Code/tsml-eval"
data_dir = "/gpfs/home/{username}/Data/Multiverse"
dataset_file = "/gpfs/home/{username}/DataSetLists/MultiverseCore.txt"
results_root = "/gpfs/home/{username}/Results/Multiverse"
state_dir = "/gpfs/home/{username}/Results/Multiverse/.controller-paper-30resamples-cpu"
resamples = 30

# Process one category to completion or a terminal outcome before moving on.
all_categories_first_pass = false

# This controller starts with clean bookkeeping while retaining old diagnostic logs.
# Ignore those logs until this controller has observed or submitted the task itself.
ignore_existing_failure_logs = true

max_attempts = 1
small_datasets_first = true
excluded_datasets = []
validate_results = false

[slurm]
account = "cmp"
partition = "compute"
qos = "uea-core-default"
max_active_tasks = 8000
cpus_per_task = 1
gpus = 0

# Start at 16 GB and retry confirmed OOM failures at progressively larger tiers.
memory_mb_levels = [16000, 32000, 64000]
time_limit = "7-00:00:00"

[environment]
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"
numba_cache_dir = "/gpfs/home/{username}/Code/.cache/numba/tsml-eval"

# Enable progress output only for estimators whose public constructor exposes a
# verbose parameter. Integer values match estimators whose verbosity is a level;
# the deep learners expose a Boolean switch.
[classifier_kwargs."DrCIF-500"]
verbose = 1

[classifier_kwargs.TDE]
verbose = 1

[classifier_kwargs.Arsenal]
verbose = 1

[classifier_kwargs.FreshPRINCE]
verbose = 1

[classifier_kwargs.HC2]
verbose = 1

[classifier_kwargs."H-InceptionTime"]
verbose = true

[classifier_kwargs."LITETime-MV"]
verbose = true

[[categories]]
name = "IntervalBased"
classifiers = ["CIF-500", "DrCIF-500", "QUANT"]

[[categories]]
name = "DictionaryBased"
classifiers = ["TDE"]

[[categories]]
name = "ShapeletBased"
classifiers = ["RDST", "STC"]

[[categories]]
name = "ConvolutionBased"
classifiers = ["Arsenal", "MRHydra", "ROCKET"]

[[categories]]
name = "DistanceBased"
classifiers = ["1NN-DTW"]

[[categories]]
name = "FeatureBased"
classifiers = ["Catch22", "FreshPRINCE"]

[[categories]]
name = "Hybrid"
classifiers = ["HC2", "RIST"]

[[categories]]
name = "DeepLearning"
classifiers = ["H-InceptionTime", "LITETime-MV"]

[[categories]]
name = "Other"
classifiers = ["Dummy"]
