# Hali (UEA). Facts about the cluster, shared by every experiment that runs on it.
# Experiments choose a [resources.*] section with `resources = "cpu"` (or "gpu") and
# may override any of its keys in their own [slurm] table.
#
# Values come from the configurations used for the Multiverse and UCR runs in 2026.

name = "hali"
home = "/gpfs/home/{user}"
repo_dir = "{home}/Code/tsml-eval"
email = "{user}@uea.ac.uk"
default_resources = "cpu"

# The supervisor runs as a small Slurm job that resubmits itself, as on Iridis 6
# (since 2026-11-06). Hali's login nodes alias python to a "start an interactive
# session" message, so a login-node loop goes against the admins' guidance; jobs
# may submit jobs (checked with sbatch --test-only from a compute node).
[supervisor]
mode = "slurm"
interval_minutes = 15
partition = "compute"
account = "cmp"
qos = "uea-core-default"
time_limit = "00:30:00"
memory_gb = 2

# One Slurm array task per experiment. Hali does not limit the number of queued tasks
# in practice (runs used up to 8000), so max_active is a courtesy cap: raise it for
# big runs when the cluster is quiet.
[resources.cpu]
mode = "array"
account = "cmp"
partition = "compute"
qos = "uea-core-default"
time_limit = "7-00:00:00"
# Compute nodes have 510433 MB (498 GiB), with no per-node memory cap: 480 GB jobs are
# accepted (sbatch --test-only, 13 Nov 2026). Beyond that, use [resources.hmem].
memory_gb = [8, 16, 32, 64, 128, 256, 480]
node_memory_gb = 498
cpus_per_task = 1
max_active = 2000
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"

# High-memory CPU jobs, for tasks that run out of memory at 480 GB on compute. The
# hmem QoS was granted to ajb on 13 Nov 2026 and must be given with the partition.
# Nodes (sinfo, 13 Nov 2026): hmem003-006 24 cores, 750 GiB; hmem001-002 64 cores,
# 2 TiB; hmem007-010 64 cores, 4 TiB, shared by the whole university. The QoS caps
# a user at 100 CPUs, but memory is the scarce resource (other users queue 500 GB to
# 4 TB jobs there), so keep at most 4 of our jobs in it at once. max_active is per
# experiment: run one hmem experiment at a time. Start at the 740 GB tier, which fits
# the 750 GiB nodes, and only go higher on an out-of-memory failure. No UEA usage
# guidance was found beyond the QoS (13 Nov 2026). sbatch --test-only accepted 740G
# and 1900G jobs.
[resources.hmem]
mode = "array"
account = "cmp"
partition = "hmem"
qos = "hmem"
time_limit = "7-00:00:00"
memory_gb = [740, 2000, 4000]
node_memory_gb = 4026
cpus_per_task = 1
max_active = 4
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval"

# Deep learners. A separate environment with GPU TensorFlow/PyTorch, see the guide.
# gpu_check fails a job fast if the framework cannot see the GPU, rather than letting
# it train silently on the CPU. Use gpu_check = "torch" for PyTorch-only learners.
[resources.gpu]
mode = "array"
account = "cmp"
partition = "gpu"
qos = "gpu"
gres = "gpu:1"
time_limit = "2-12:00:00"
memory_gb = [64, 128]
cpus_per_task = 2
max_active = 16
module = "python/anaconda/2024.10/3.12.7"
conda_sh = "/gpfs/software/hali/python/anaconda/2024.10/etc/profile.d/conda.sh"
env_name = "tsml-eval-gpu"
gpu_check = "tensorflow"
