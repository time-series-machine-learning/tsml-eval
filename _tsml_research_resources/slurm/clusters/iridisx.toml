# Iridis X (Southampton GPU cluster). Facts shared by every experiment on it.
#
# Iridis X is mainly for GPU work, but its amd CPU partition (QoS amd: 512 cores on up
# to 8 nodes per user, 64 cores and 240 GB per node, 2.5 days) is often emptier than
# Iridis 6 batch, which allows only 4 nodes; see [resources.cpu]. The gres type string
# differs per partition and must match exactly, otherwise sbatch rejects the job.
# Partition table (sinfo, 14/08/2026):
#
#   a100        gpu:a100:1        2-12:00:00  open to all; QoS caps 2 GPUs at once
#   swarm_a100  gpu:a100swarm:1   5-00:00:00  ECS/ORC staff and PGR, account "ecs"
#   i7_h200     gpu:h200:1        2-12:00:00  H200 early access
#   scavenger_4a100  gpu:a100swarm:1  12:00:00  preemptible; fine for this workload,
#                                    a preempted task writes nothing and is resubmitted
#
# There is no "batch" partition here, and --nodes=1 is required (always generated).

name = "iridisx"
home = "/home/{user}"
repo_dir = "{home}/Code/tsml-eval-gpu"
email = "{user}@soton.ac.uk"
default_resources = "gpu"

# Iridis X runs have used a login-node supervisor in screen.
[supervisor]
mode = "login"
interval_minutes = 30

# CPU task farm on the amd partition (sinfo/sacctmgr, 11/11/2026): 64-core,
# 240 GB nodes; QoS amd caps a user at 8 nodes / 512 cores. Iridis X shares its home
# with Iridis 6, so CPU experiments use the Iridis 6 checkout and env (set
# repo_dir = "{home}/Code/tsml-eval" in the experiment). Tasks needing more than
# 240 GB must stay on Iridis 6 highmem.
[resources.cpu]
mode = "farm"
partition = "amd"
time_limit = "2-12:00:00"
memory_gb = [4, 8, 16, 32, 64, 128, 230]
max_jobs = 8
node_cpus = 64
node_memory_gb = 234
waves = 4
module = "conda/python3"
env_name = "tsml-eval"


# H200 nodes: the queue used for most 2026 deep-learning runs.
[resources.gpu]
mode = "array"
partition = "i7_h200"
gres = "gpu:h200:1"
time_limit = "2-12:00:00"
memory_gb = [32, 64, 128]
cpus_per_task = 2
max_active = 8
module = "conda/python3"
env_name = "tsml-eval-gpu"
gpu_check = "tensorflow"

[resources.gpu-a100]
mode = "array"
partition = "a100"
gres = "gpu:a100:1"
time_limit = "2-12:00:00"
memory_gb = [32, 64, 128]
cpus_per_task = 2
max_active = 2
module = "conda/python3"
env_name = "tsml-eval-gpu"
gpu_check = "tensorflow"

[resources.gpu-swarm]
mode = "array"
account = "ecs"
partition = "swarm_a100"
gres = "gpu:a100swarm:1"
time_limit = "5-00:00:00"
memory_gb = [32, 64, 128]
cpus_per_task = 2
max_active = 8
module = "conda/python3"
env_name = "tsml-eval-gpu"
gpu_check = "tensorflow"
