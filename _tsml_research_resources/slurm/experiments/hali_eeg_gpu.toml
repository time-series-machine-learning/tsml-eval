# aeon-neuro deep learners on the aeon-neuro EEG archive, on Hali GPUs.
#
# EEGNet, DeepConvNet and EEGConformer are PyTorch (braindecode), so the GPU check
# is torch, not the profile's TensorFlow default. They use CUDA only "when
# available", so device = "cuda" makes a job fail instead of quietly training on
# the CPU.
# EEGConformer needs aeon-neuro >= 0.1.1.
#
# CBraMod and Labram (frozen pretrained encoders) are left out: they expect 200 Hz
# data scaled to 0.1 mV, download weights from the Hugging Face Hub (compute nodes
# may have no internet: download once on the login node, then HF_HUB_OFFLINE=1),
# and Labram needs the 10-20 channel names of each dataset.
#
#   python tsml_slurm.py check experiments/hali_eeg_gpu.toml
#   python tsml_slurm.py start experiments/hali_eeg_gpu.toml

[experiment]
name = "eeg-gpu"
cluster = "hali"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/EEG.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["EEGNet", "DeepConvNet", "EEGConformer"]

[estimator_kwargs.EEGNet]
device = "cuda"

[estimator_kwargs.DeepConvNet]
device = "cuda"

[estimator_kwargs.EEGConformer]
device = "cuda"

[slurm]
env_name = "tsml-eval-gpu"
gpu_check = "torch"
memory_gb = [32, 64, 128]
