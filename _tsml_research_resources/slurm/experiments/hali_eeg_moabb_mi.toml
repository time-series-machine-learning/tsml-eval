# MOABB's own MDM and CSP pipelines on the motor imagery problems, on Hali CPUs, for
# comparison with MOABB's published table (as hali_eeg_baselines_mi.toml does for
# TS-LR). Code: aeon-neuro branch ajb/eeg-baselines,
# aeon_neuro.classification.experimental.MOABBPipelineClassifier, after MOABB's
# 8-32 Hz IIR band-pass:
#
#   MDM-MOABB      pipeline="MDM" (MDM.yml): OAS covariance, MDM, Riemannian metric
#   CSP-LDA-MOABB  pipeline="CSP_LDA" (CSP.yml): OAS covariance, pyriemann CSP (6
#                  filters, log-variance), LDA (svd solver)
#
# Same motor imagery list and dataset_info as TSLR-MOABB.
#
#   python tsml_slurm.py check experiments/hali_eeg_moabb_mi.toml
#   python tsml_slurm.py start experiments/hali_eeg_moabb_mi.toml

[experiment]
name = "eeg-moabb-mi"
cluster = "hali"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_motor_imagery.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_sampling_rates.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DistanceBased = ["MDM-MOABB"]
FeatureBased = ["CSP-LDA-MOABB"]

[estimator_kwargs."MDM-MOABB"]
sfreq = "{dataset.sfreq}"

[estimator_kwargs."CSP-LDA-MOABB"]
sfreq = "{dataset.sfreq}"

[slurm]
env_name = "tsml-eval"
memory_gb = [16, 32, 64, 128]
