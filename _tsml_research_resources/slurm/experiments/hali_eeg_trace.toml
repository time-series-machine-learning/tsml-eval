# TRACE (Temporal Riemannian Adaptive Classification Ensemble, aeon-neuro PR #296).
# Its fit cross-validates 56 (intervals, k) settings, so it runs on the 50 problems
# under 200M values (eeg_no_pigs.txt, smallest first); extend to the rest if the
# largest of these finish comfortably.
# Needs aeon-neuro ajb/eeg-baselines with TRACE exported from distance_based.
#
#   python tsml_slurm.py check experiments/hali_eeg_trace.toml
#   python tsml_slurm.py start experiments/hali_eeg_trace.toml

[experiment]
name = "eeg-trace"
cluster = "hali"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_no_pigs.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DistanceBased = ["TRACE"]

[slurm]
env_name = "tsml-eval"
memory_gb = [16, 32, 64, 128]
