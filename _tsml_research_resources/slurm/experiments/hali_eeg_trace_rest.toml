# TRACE on the 26 problems the first run (hali_eeg_trace.toml, eeg_no_pigs.txt) left
# out, so it covers all 76 in eeg_eligible.txt. The 50 already done are skipped as
# results on disk. Same settings as that run: the student's code unchanged, with
# cross_validate = false (intervals = 5, k = 10). The longest of the 50 took 5.5 h;
# SymbolAttention (about 700k trials) may not fit in Hali's 7 days or 128 GB, and
# NaN failures are left as failures.
#
#   python tsml_slurm.py check experiments/hali_eeg_trace_rest.toml
#   python tsml_slurm.py start experiments/hali_eeg_trace_rest.toml

[experiment]
name = "eeg-trace-rest"
cluster = "hali"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_eligible.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DistanceBased = ["TRACE"]

[estimator_kwargs."TRACE"]
cross_validate = false

[slurm]
env_name = "tsml-eval"
memory_gb = [32, 64, 128]
