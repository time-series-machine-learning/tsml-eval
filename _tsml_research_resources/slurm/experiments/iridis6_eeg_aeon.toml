# The aeon CPU classifiers from EEGBench (github.com/TonyBagnall/EEGBench), with the
# tabular RotationForest, RandomForest, SVM and LogisticRegression, on Iridis 6. HC2
# is in iridis6_eeg_hc2.toml and its components (Arsenal, DrCIF, STC, TDE) in
# iridis6_eeg_hc2_components.toml, which also writes train files; the aeon-neuro classifiers are in iridis6_eeg_cpu.toml and the aeon deep
# learners in iridisx_eeg_aeon_gpu.toml.
#
# Results go in ~/Results/EEG/<Category>/<Name>/Predictions/<Dataset>/, grouped by
# aeon module like the other EEG experiments. Estimator names are EEGBench's; for
# EEGBench's ingest, point predictions_path at each category directory. Default
# (majority class) is not run; ingest builds it from the test labels. Resample 0
# only: the given splits keep each subject on one side.
#
# The datasets are those in ~/DataSetLists/eeg.txt, one name per line (EEGBench's
# 28 open problems are aeon's eeg2026 list). To add problems later, put their .ts
# files in ~/Data/EEG/<Name>/ and add the names to eeg.txt; nothing else changes.

[experiment]
name = "eeg-aeon"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/eeg.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

# Grouped as aeon groups them (aeon.classification.<module>).
[estimators]
# MRHydra is in iridis6_eeg_mrhydra.toml, starting at large memory; ROCKET and
# MiniROCKET are not run (their existing results are kept).
IntervalBased = ["QUANT"]
# FreshPRINCE is not run (its existing results are kept).
Tabular = ["RotationForest", "RandomForest", "SVM", "LogisticRegression"]
# The aeon-neuro classifiers of iridis6_eeg_cpu.toml, moved here (2026-11-06) so the
# open eeg-aeon farm tops up with them rather than waiting for a node of their own.
# Do not start eeg-cpu while they are here: the two would run the same tasks.
DistanceBased = [
    "RiemannianMDM", "RiemannianKNN", "RiemannianMDM-OAS", "RiemannianKNN-OAS",
]
FeatureBased = ["CSP+LDA", "CSP+SVM", "XDAWN"]

[slurm]
env_name = "tsml-eval"
max_jobs = 1          # one node; eeg-cpu has another, eeg-hc2 two
memory_gb = [16, 32, 64, 128, 256, 620]
top_up = true         # a farm down to its slow tasks takes waiting ones,
top_up_hours = 36     # while it has 36 hours or more of its 60 left: no
                      # checkpoints, and RotationForest can take a day
