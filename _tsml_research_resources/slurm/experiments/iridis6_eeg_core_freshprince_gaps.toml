# The two core FreshPRINCE datasets absent from the existing experiment lists.
[experiment]
name = "eeg-core-freshprince-gaps-6"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_core_freshprince_gaps.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
FeatureBased = ["FreshPRINCE"]

[slurm]
env_name = "tsml-eval"
max_jobs = 1
memory_gb = [16, 32, 64, 128, 256, 620]
top_up = true
top_up_hours = 36
