# The HC2 components from EEGBench (Arsenal, DrCIF, STC, TDE) on Iridis 6, with train
# files as well as test files. The train files hold each component's own train
# estimate, so HC2 can be rebuilt from these results (its weights come from them)
# without refitting. Same data, dataset list and results layout as
# iridis6_eeg_aeon.toml, which runs the other aeon classifiers.

[experiment]
name = "eeg-hc2-components"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/eeg.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true
train_files = true                  # completion needs train AND test files

[estimators]
ConvolutionBased = ["Arsenal"]
IntervalBased = ["DrCIF"]
ShapeletBased = ["STC"]
DictionaryBased = ["TDE"]

[slurm]
env_name = "tsml-eval"
memory_gb = [16, 32, 64, 128, 256, 620]
