# HC2 components (Arsenal, DrCIF, DrCIF-500, STC, TDE) on the 36 problems of the
# MI/Clinical/Cognitive 30/30/30 set that Iridis lacked until 14 Nov 2026
# (eeg_iridis_new.txt), on Iridis 6 batch nodes. Moved here from Iridis X
# (iridisx_eeg_hc2_new.toml) on 15 Nov 2026 before any task ran there: its farms sat
# behind the amd partition's queue, and HC2 takes priority over the checkpointed
# RotationForest run (iridis6_eeg_rotf_ch.toml, paused). Iridis 6 and Iridis X share
# the home file system, so the data and results directories are the same.
#
# Same settings as iridis6_eeg_hc2_components.toml: train and test files,
# checkpointed, a timed-out task resumes from its checkpoint.
#
# Hali runs the same components on most of these problems (hali_eeg_hc2_new.toml,
# hali_eeg_hc2_rest.toml); whichever cluster finishes a task first supplies the
# result, and the other copy can then be cancelled.
#
#   python tsml_slurm.py check experiments/iridis6_eeg_hc2_new.toml
#   python tsml_slurm.py start experiments/iridis6_eeg_hc2_new.toml

[experiment]
name = "eeg-hc2-new-6"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_iridis_new.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true
train_files = true                   # completion needs train AND test files
extra_args = ["-ch", "-chi", "420"]  # checkpoint, at least 7 hours apart
retry_timeouts = true                # a timed-out task resumes from its checkpoint
max_attempts = 4
priority = "dataset"

[estimators]
ConvolutionBased = ["Arsenal"]
IntervalBased = ["DrCIF", "DrCIF-500"]
ShapeletBased = ["STC-aeon"]
DictionaryBased = ["TDE"]

[estimator_kwargs.Arsenal]
verbose = 1

[estimator_kwargs.DrCIF]
verbose = 1

[estimator_kwargs."DrCIF-500"]
verbose = 1

[estimator_kwargs."STC-aeon"]
verbose = 1

[estimator_kwargs.TDE]
verbose = 1

[slurm]
env_name = "tsml-eval"
max_jobs = 4                         # Iridis 6 holds a user to 4 nodes
waves = 1                            # every task starts with the full 60 hours
top_up = true
top_up_hours = 12
memory_gb = [16, 32, 64, 128, 256, 620]
