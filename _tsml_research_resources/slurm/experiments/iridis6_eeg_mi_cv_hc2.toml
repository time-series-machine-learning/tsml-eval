# Subject-wise cross-validation of the HC2 components (Arsenal, DrCIF-500, STC-aeon,
# TDE) on the 26 motor imagery problems (eeg_mi_only.txt), on Iridis 6. The
# expensive half of the MI CV; the cheap classifiers are in iridisx_eeg_mi_cv.toml,
# with the same folds (252 in all, set by the subject ID files).
#
# Train files are written too, so HC2 can be built from these results per fold, as
# for the default split (iridis6_eeg_hc2_components.toml). Checkpointed: a fold
# killed at the 60 hour limit resumes from its last checkpoint, up to 4 runs.
# DrCIF-500 only, as HC2 uses it; the 200 tree DrCIF is not cross-validated.
#
# Iridis 6 allows 4 nodes per user (expert QoS) across all experiments, so this
# waits for nodes the default-split runs free.
#
#   python tsml_slurm.py check experiments/iridis6_eeg_mi_cv_hc2.toml
#   python tsml_slurm.py start experiments/iridis6_eeg_mi_cv_hc2.toml

[experiment]
name = "eeg-mi-cv-hc2"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_mi_only.txt"
results_dir = "{home}/Results/EEG-CV"
cv_folds = 10
smallest_datasets_first = true
train_files = true                   # completion needs train AND test files
extra_args = ["-ch", "-chi", "420"]  # checkpoint, at least 7 hours apart
retry_timeouts = true                # a timed-out fold resumes from its checkpoint
max_attempts = 4
priority = "dataset"                 # all four components on a dataset together

[estimators]
ConvolutionBased = ["Arsenal"]
IntervalBased = ["DrCIF-500"]
ShapeletBased = ["STC-aeon"]
DictionaryBased = ["TDE"]

[estimator_kwargs.Arsenal]
verbose = 1
[estimator_kwargs."DrCIF-500"]
verbose = 1
[estimator_kwargs."STC-aeon"]
verbose = 1
[estimator_kwargs.TDE]
verbose = 1

[slurm]
env_name = "tsml-eval"
max_jobs = 2
waves = 1
top_up = true
top_up_hours = 12
memory_gb = [16, 32, 64, 128, 256, 620]
