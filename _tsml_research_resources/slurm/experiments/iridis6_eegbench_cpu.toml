# EEGBench (github.com/TonyBagnall/EEGBench): every CPU estimator on its leaderboard,
# on Iridis 6. The deep learners are in iridisx_eegbench_gpu.toml.
#
# Estimator names are EEGBench's, and the list is flat, so results land in
# ~/Results/EEGBench/<Name>/Predictions/<Dataset>/, the layout EEGBench's ingest
# reads: set predictions_path there. Default (majority class) is not run; ingest
# builds it from the test labels. Resample 0 only: the given splits keep each subject
# on one side.
#
# The datasets are those in ~/DataSetLists/eeg.txt, one name per line (EEGBench's
# 28 open problems are aeon's eeg2026 list). To add problems later, put their .ts
# files in ~/Data/EEG/<Name>/ and add the names to eeg.txt; nothing else changes.

[experiment]
name = "eegbench-cpu"
cluster = "iridis6"
resources = "cpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/eeg.txt"
results_dir = "{home}/Results/EEGBench"
resamples = 1
smallest_datasets_first = true
estimators = [
    # general purpose time series classifiers
    "HC2", "MRHydra", "Arsenal", "DrCIF", "STC", "TDE",
    "ROCKET", "MiniROCKET", "QUANT", "FreshPRINCE",
    # designed for EEG (aeon-neuro)
    "CSP-SVM", "R-MDM", "R-KNN",
    # standard classifiers, on the concatenated channels
    "SVM", "RandomForest", "RotationForest", "LogisticRegression",
]

[slurm]
env_name = "tsml-eval"
memory_gb = [16, 32, 64, 128, 256, 620]
