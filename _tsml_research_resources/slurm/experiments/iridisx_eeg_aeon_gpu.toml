# aeon's deep learners: CNN and InceptionTime from EEGBench
# (github.com/TonyBagnall/EEGBench), and LITETime-MV, on Iridis X H200s. These are
# TensorFlow models, so jobs run the profile's TensorFlow GPU check: the env needs
# TensorFlow with GPU support. The aeon-neuro deep learners (PyTorch) are in
# iridisx_eeg_gpu.toml.
#
# Names, data, dataset list and results layout are as in iridis6_eeg_aeon.toml, so
# results land in ~/Results/EEG/DeepLearning/<Name>/Predictions/<Dataset>/.

[experiment]
name = "eeg-aeon-gpu"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/eeg.txt"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["CNN", "IT", "LITETime-MV"]

[slurm]
env_name = "tsml-eval-gpu"
memory_gb = [32, 64, 128]
