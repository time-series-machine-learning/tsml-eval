# BIOT (Yang et al., NeurIPS 2023), full encoder fine-tuning, offline checkpoint.
# Uses unsupervised SHHS+PREST 18-channel checkpoint (zero downstream Core-90 task overlap).
# Isolated aeon-neuro snapshot (aeon-neuro-fm-20261119) so running 20261118 jobs are unaffected.
[experiment]
name = "eeg-biot-x"
cluster = "iridisx"
resources = "gpu-a100"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_core90.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["BIOT-FT"]

[estimator_kwargs."BIOT-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/braindecode--biot-pretrained-shhs-prest-18chs/pytorch_model.bin"
variant = "shhs-prest-18chs"
batch_size = 64
device = "cuda"
verbose = true

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 2  # a100 QoS caps a user at 2 GPUs
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261119:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261119 && sha256sum --quiet -c SNAPSHOT.sha256',
]
