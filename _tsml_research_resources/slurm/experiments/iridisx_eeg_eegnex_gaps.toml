# EEGNeX-NB (core) on the core-90 problems that lacked it on 17 Nov 2026
# (dataset_lists/eeg_gpu_gaps_eegnex.txt), on Iridis X GPUs while they were idle and
# Hali's GPU queue was full. Same model and kwargs as hali_eeg_nb_more.toml. The
# Iridis torch env has aeon-neuro e799ee6 (ajb/eeg-baselines); Hali has 2b13d5c,
# which only adds LR baselines on top, so NeuralBenchDeepClassifier is the same.
# Before starting, drop from the list any problem Hali has finished or is running.
#
#   python tsml_slurm.py check experiments/iridisx_eeg_eegnex_gaps.toml
#   python tsml_slurm.py start experiments/iridisx_eeg_eegnex_gaps.toml

[experiment]
name = "eeg-eegnex-gaps-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_gpu_gaps_eegnex.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_ctnet_info.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["EEGNeX-NB"]

[estimator_kwargs."EEGNeX-NB"]
sfreq = "{dataset.sfreq}"
train_groups = "{dataset.train_groups}"
device = "cuda"

[slurm]
env_name = "tsml-eval-torch"
time_limit = "12:00:00"
max_active = 20
gpu_check = "torch"
memory_gb = [32, 64, 128]
