# EEGPT and BIOT, full encoder fine-tuning pilot (1 epoch), offline checkpoints.
# Isolated aeon-neuro snapshot (aeon-neuro-fm-20261119); leaves aeon-neuro-fm-20261118 untouched.
# Pilot results write to ~/Results/EEG-FM-Pilot and never enter the main comparison.
[experiment]
name = "eeg-eegpt-biot-pilot-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_pilot.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG-FM-Pilot"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["EEGPT-FT", "BIOT-FT"]

[estimator_kwargs."EEGPT-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/braindecode--eegpt-pretrained/pytorch_model.bin"
batch_size = 32
device = "cuda"
verbose = true
n_epochs = 1
early_stopping_patience = 1

[estimator_kwargs."BIOT-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/braindecode--biot-pretrained-shhs-prest-18chs/pytorch_model.bin"
variant = "shhs-prest-18chs"
batch_size = 64
device = "cuda"
verbose = true
n_epochs = 1
early_stopping_patience = 1

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 4
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261119:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261119 && sha256sum --quiet -c SNAPSHOT.sha256',
]
