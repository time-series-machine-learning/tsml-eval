# LaBraM-FT and CBraMod-FT gaps on the core 90, moved from Hali's eeg-fm-ft (19 Nov 2026)
# to the i7_h200 slots REVE-FT freed. Only the gap problems are listed: Iridis cannot see
# Hali's finished results, so the full list would rerun them. The matching Hali tasks are
# cancelled. Estimator settings match hali_eeg_fm_ft.toml; the snapshot's LaBraM and
# CBraMod code is functionally identical to Hali's aeon-neuro 2b13d5c. The -random
# ablations stay on Hali.
[experiment]
name = "eeg-fm-ft-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_gaps_iridisx.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true
# CBraMod-FT is only missing ImaginedArmGraspElbow (DepressionRest finished on Hali)
exclude_tasks = [
  "CBraMod-FT|DepressionRest|0",
  "CBraMod-FT|ImaginedArmMovements|0",
  "CBraMod-FT|ImaginedArmTasks|0",
  "CBraMod-FT|MigraineRest|0",
  "CBraMod-FT|ParkinsonsPedalling|0",
  "CBraMod-FT|SchizophreniaUltimatum|0",
  "CBraMod-FT|ImaginedLimbActions|0",
  "CBraMod-FT|AdultADHDAttention|0",
]

[estimators]
DeepLearning = ["CBraMod-FT", "LaBraM-FT"]

[estimator_kwargs."CBraMod-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
weights_path = "/home/ajb2u23/hf_models/braindecode--cbramod-pretrained"
device = "cuda"

[estimator_kwargs."LaBraM-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names}"
weights_path = "/home/ajb2u23/hf_models/braindecode--labram-pretrained"
device = "cuda"

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 4
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261118:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261118 && sha256sum --quiet -c SNAPSHOT.sha256',
]
