# One-off LaBraM-FT on the middle 16 s of each case, for the three core-90 problems whose
# windows exceed LaBraM's 16 s limit (DementiaPhotic 18 s, ImaginedHandMusicTempo 20 s,
# Alzheimers 30 s; 19 standard 10-20 channels each). The pretrained checkpoint has 16
# temporal embeddings, so full LaBraM-FT cannot run these. Results go to their own
# LaBraM-FT-mid16 folder; report them as LaBraM-FT with a footnote, or keep them apart.
# Same kwargs as LaBraM-FT in iridisx_eeg_fm_ft.toml, but with ch_names_any_length,
# because the LaBraM ch_names column is blank for windows over 16 s.
[experiment]
name = "eeg-labram-mid16-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_labram_mid16.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["LaBraM-FT-mid16"]

[estimator_kwargs."LaBraM-FT-mid16"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/braindecode--labram-pretrained"
device = "cuda"

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 3
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261118:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261118 && sha256sum --quiet -c SNAPSHOT.sha256',
]
