# Within-subject MI case study (22 Nov 2026), GPU part: REVE-FT on the i7_h200 partition.
# Same protocol as iridisx_eeg_mi_within_subject.toml (10 contiguous folds per subject in
# recording order, one file per subject under WithinSubject) on all 19 problems in
# eeg_mi_within_subject.txt. Same estimator settings, snapshot (aeon-neuro-fm-20261118)
# and weights as eeg-reve-luna-x and eeg-mi-cv-reve-x. One subject cannot be split by
# subject, so tsml-eval sets train_groups to None and early stopping validates on a
# random split of the training trials; the train_groups file given here is replaced.
#
#   python tsml_slurm.py check experiments/iridisx_eeg_mi_within_subject_reve.toml
#   python tsml_slurm.py start experiments/iridisx_eeg_mi_within_subject_reve.toml

[experiment]
name = "eeg-mi-ws-reve-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_mi_within_subject.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG-WS"
within_subject_folds = 10
smallest_datasets_first = true
retry_timeouts = true
max_attempts = 4

[estimators]
DeepLearning = ["REVE-FT"]

[estimator_kwargs."REVE-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/brain-bzh--reve-base/pytorch_model.bin"
batch_size = 8
device = "cuda"
verbose = true
positions_path = "/home/ajb2u23/hf_models/brain-bzh--reve-base/reve_positions.json"

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 4
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261118:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261118 && sha256sum --quiet -c SNAPSHOT.sha256',
]

[supervisor]
interval_minutes = 10
