# REVE Base and LUNA Base, full encoder fine-tuning, offline checkpoints.
# Isolated aeon-neuro snapshot; existing experiments keep their installed package.
# REVE uses batch size 8 for attention memory; LUNA retains batch size 64.
# Pilot results are separate and must never enter the main comparison.
[experiment]
name = "eeg-reve-luna-x"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{repo}/_tsml_research_resources/dataset_lists/eeg_core90.txt"
dataset_info = "{repo}/_tsml_research_resources/dataset_lists/eeg_fm_info.csv"
results_dir = "{home}/Results/EEG"
resamples = 1
smallest_datasets_first = true

[estimators]
DeepLearning = ["REVE-FT", "LUNA-FT"]

[estimator_kwargs."REVE-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/brain-bzh--reve-base/pytorch_model.bin"
batch_size = 8
device = "cuda"
verbose = true
positions_path = "/home/ajb2u23/hf_models/brain-bzh--reve-base/reve_positions.json"

[estimator_kwargs."LUNA-FT"]
sfreq = "{dataset.sfreq}"
input_units = "{dataset.input_units}"
train_groups = "{dataset.train_groups}"
ch_names = "{dataset.ch_names_any_length}"
weights_path = "/home/ajb2u23/hf_models/PulpBio--LUNA/LUNA_base.bin"
batch_size = 64
device = "cuda"
verbose = true
variant = "base"

[slurm]
env_name = "tsml-eval-torch"
gpu_check = "torch"
memory_gb = [64, 128]
max_active = 4
setup = [
  'export PYTHONNOUSERSITE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1',
  'export PYTHONPATH=/home/ajb2u23/Code/aeon-neuro-fm-20261118:$PYTHONPATH',
  'cd /home/ajb2u23/Code/aeon-neuro-fm-20261118 && sha256sum --quiet -c SNAPSHOT.sha256',
]
