# EEGBench deep learners on Iridis X H200s: aeon's TensorFlow CNN and InceptionTime,
# and aeon-neuro's PyTorch EEGNet and DeepConvNet (DCN). Same data, dataset list and
# results directory as iridis6_eegbench_cpu.toml; see it for the dataset list.
#
# The env needs both frameworks with GPU support. Jobs run the profile's TensorFlow
# GPU check; the PyTorch models get device = "cuda" so they fail rather than train
# on the CPU.

[experiment]
name = "eegbench-gpu"
cluster = "iridisx"
resources = "gpu"
task = "classification"
repo_dir = "{home}/Code/tsml-eval-gpu"
branch = "ajb/slurm-runner"
data_dir = "{home}/Data/EEG"
datasets = "{home}/DataSetLists/eegbench.txt"
results_dir = "{home}/Results/EEGBench"
resamples = 1
smallest_datasets_first = true
estimators = ["CNN", "IT", "EEGNet", "DCN"]

[estimator_kwargs.EEGNet]
device = "cuda"

[estimator_kwargs.DCN]
device = "cuda"

[slurm]
env_name = "tsml-eval-gpu"
memory_gb = [32, 64, 128]
